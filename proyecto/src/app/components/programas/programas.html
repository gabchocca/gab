<section id="programas" class="py-5 bg-light">

    <div class="container">
  
      <div class="text-center mb-5">
  
        <span class="text-primary fw-bold">
          PROGRAMAS
        </span>
  
        <h2 class="fw-bold">
          Programas de estudio
        </h2>
  
        <p class="text-secondary">
          Elige la modalidad que mejor se adapte a ti.
        </p>
  
      </div>
  
      <div class="row g-4">
  
        @for (programa of programas; track programa.titulo) {
  
          <div class="col-md-4">
  
            <div class="card h-100 border-0 shadow-sm">
  
              <div class="card-body p-4">
  
                <span class="badge bg-primary mb-3">
                  {{ programa.tipo }}
                </span>
  
                <h3 class="h4 fw-bold">
                  {{ programa.titulo }}
                </h3>
  
                <p class="text-secondary">
                  {{ programa.descripcion }}
                </p>
  
                <ul class="list-unstyled">
  
                  @for (item of programa.items; track item) {
  
                    <li class="mb-2">
                      ✓ {{ item }}
                    </li>
  
                  }
  
                </ul>
  
                <a
                  href="#horarios"
                  class="btn btn-outline-primary w-100">
                  Consultar horarios
                </a>
  
              </div>
  
            </div>
  
          </div>
  
        }
  
      </div>
  
    </div>
  
  </section>
